# Local development stack. Not production - see docker-compose.prod.yml (Phase 9).
#   docker compose -f infrastructure/compose/docker-compose.dev.yml up -d
#
# Host ports default to a high range so the stack does not collide with a locally
# installed PostgreSQL, Redis or anything else on the standard ports - which IS the
# case on at least one developer machine here. Override with env vars if you prefer:
#   HRM_PG_PORT=5432 docker compose -f ... up -d
# All bind to 127.0.0.1 only. Never expose a database to the LAN.
name: panasahrm-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: hrm-postgres
    environment:
      POSTGRES_USER: hrm
      POSTGRES_PASSWORD: hrm_dev_only
      POSTGRES_DB: hrm
      # Deterministic collation. A collation change between environments silently
      # reorders indexes and can corrupt unique constraints on text columns.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=200
      - -c
      - max_connections=100
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "127.0.0.1:${HRM_PG_PORT:-55432}:5432"
    volumes:
      # PG18 changed this: the volume mounts at /var/lib/postgresql, NOT .../data.
      # The image then places data in a major-version subdirectory, which is what makes
      # `pg_upgrade --link` possible later without mount-boundary problems. Mounting at
      # .../data on 18+ makes the container refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrm -d hrm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hrm-redis
    command: ["redis-server", "--requirepass", "redis_dev_only", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${HRM_REDIS_PORT:-55379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_only", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: hrm-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: hrm_minio
      MINIO_ROOT_PASSWORD: minio_dev_only
    ports:
      - "127.0.0.1:${HRM_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${HRM_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: hrm-adminer
    ports:
      - "127.0.0.1:${HRM_ADMINER_PORT:-58080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
