# =============================================================================
# ART HRM - nginx edge configuration
# =============================================================================
#
# Terminates TLS, sets the security headers, rate-limits the paths worth
# limiting, and routes:
#
#     /api/*  -> api:4000     (same origin as the app, so the session cookie
#                              needs no cross-origin handling at all)
#     /*      -> web:3000
#
# Routing /api here rather than through Next's rewrite removes a hop. The
# rewrite stays in next.config.ts as a fallback for running the app without
# this edge.
# =============================================================================

# Rate limit zones. Login is the one that matters: the API already locks an
# account after 10 consecutive failures, but that is per-account - it does
# nothing about one client spraying one password across many accounts, which is
# what this catches.
limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m    rate=20r/s;

# Uploads are streamed through the API (no presigned URLs, DEC-046), so the
# edge has to allow a document-sized body. 25 MiB is the cap the database
# enforces on a document version; a little headroom covers the multipart
# envelope.
client_max_body_size 26m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME http-01 challenges, if certificates are renewed that way.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 is kept only if an old client genuinely needs it. Drop it if not.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --- Security headers ---------------------------------------------------
    # HSTS: start with a SHORT max-age and raise it once the certificate
    # renewal is proven. A long max-age on a domain whose TLS later breaks locks
    # users out of it, and it cannot be undone from the server side.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Location is requested by the punch screen; nothing else is used. Denying
    # the rest means a compromised dependency cannot silently ask for a camera.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # --- Login: the tight limit --------------------------------------------
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/hrm-proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/hrm-proxy.inc;

        # Documents and payslips stream through the API. Buffering a 25 MB
        # response in nginx before sending a byte makes a download feel broken.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://web:3000;
        include /etc/nginx/conf.d/hrm-proxy.inc;
    }
}
