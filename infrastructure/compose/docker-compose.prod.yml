# PanasaHRM production stack - Docker Compose on a single VM (ADR-0013).
#
#   host nginx (TLS :7777) --/panasa-hrm/-->  127.0.0.1:4788
#                                                   |  nginx (edge, :80)
#                                                   |-- /api/ -->  api  :4000   (NestJS 11)
#                                                   `-- /     -->  web  :3100   (Next.js 16)
#                                                                    |
#                                          postgres :5432  <---------|
#                                          minio    :9000  <---------'
#
# TOPOLOGY: this app does NOT own the host. The VM already runs several apps behind one nginx
# that terminates TLS on :7777 and path-routes to loopback ports (/hr-agent/ is on 4767).
# PanasaHRM takes 4788 (4787 was already in use). So the edge nginx here speaks PLAIN HTTP on
# loopback and mounts no certificate - TLS ends one hop upstream.
#
# ONLY the edge nginx publishes a host port, and only to 127.0.0.1. PostgreSQL, MinIO and Redis
# are reachable on the compose network and nowhere else - never expose a database, or an object
# store holding employee documents, to the LAN.
#
# Run it from the REPOSITORY ROOT (the build contexts are the repo root):
#   ./deploy.sh
# or by hand:
#   docker compose -f infrastructure/compose/docker-compose.prod.yml \
#                  --env-file infrastructure/compose/prod.env up -d --build
#
# Every secret below is ${VAR:?...} with no default, on purpose: a missing secret must stop the
# deploy naming the variable, not start the stack on a development password.
#
# ON `build:` - ADR-0013 wants images built in CI and deployed by DIGEST, never built on the
# production host. No CI exists yet (amendment (a), task T12), so they are built here and
# `HRM_IMAGE_TAG` is the seam: when CI lands, delete the `build:` blocks and set the tag to the
# released digest. Keeping both today is what makes the stack deployable at all.

name: panasahrm

services:
  # --------------------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: hrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-hrm}
      POSTGRES_USER: ${HRM_PG_OWNER_USER:?set HRM_PG_OWNER_USER in prod.env}
      POSTGRES_PASSWORD: ${HRM_PG_OWNER_PASSWORD:?set HRM_PG_OWNER_PASSWORD in prod.env}
      # Two things, and both matter:
      #   --locale/--encoding  deterministic collation. A collation difference between
      #                        environments silently reorders indexes and can corrupt unique
      #                        constraints on text columns.
      #   --auth-host          scram-sha-256; the default would still allow md5.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8 --auth-host=scram-sha-256"
    command:
      - postgres
      # The server runs UTC, which is what fn_business_date() documents and expects: it reads
      # `now() AT TIME ZONE <org_setting company.timezone, default Asia/Kolkata>`, so it is
      # immune to this setting. Pinning the server to Asia/Kolkata instead would make production
      # disagree with docker-compose.dev.yml for anything that DOES touch CURRENT_DATE, silently.
      # Leave it UTC; the business date comes from the function, never from the server clock.
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=500
      - -c
      - max_connections=100
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      # DEC-010 / ADR-0013(c): PG18 mounts at /var/lib/postgresql, NOT .../data. The image places
      # the cluster in a major-version subdirectory, which is what makes a later
      # `pg_upgrade --link` possible across the mount boundary. Mounting at .../data on 18+ makes
      # the container refuse to start, reporting what looks like a version mismatch.
      #
      # THE LIVE DATA PATH IS /var/lib/postgresql/18/docker. Any backup or restore must target it
      # explicitly - this is the thing that is easy to get wrong at 3am.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # --------------------------------------------------------------------------------------
  minio:
    # Pinned to a release, not :latest. An object store holding employee documents must not
    # change version because somebody happened to re-pull on a Tuesday.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: hrm-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${HRM_MINIO_ACCESS_KEY:?set HRM_MINIO_ACCESS_KEY in prod.env}
      MINIO_ROOT_PASSWORD: ${HRM_MINIO_SECRET_KEY:?set HRM_MINIO_SECRET_KEY in prod.env}
      MINIO_BROWSER: ${HRM_MINIO_BROWSER:-off}   # console off in production by default
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------------------------------------
  # Running but UNUSED by the application - sessions are still PostgreSQL rows (OR-21). Present
  # so that switching to it is a configuration change rather than a redeploy of the stack.
  redis:
    image: redis:7-alpine
    container_name: hrm-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${HRM_REDIS_PASSWORD:?set HRM_REDIS_PASSWORD in prod.env}
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
    environment:
      REDIS_PASSWORD: ${HRM_REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------------------
  # ADR-0013: migrations run as a SEPARATE ONE-SHOT CONTAINER, never on app boot. `api` waits for
  # this to exit 0, so a failed migration means the API never starts against a half-applied
  # schema, instead of every replica racing to apply it.
  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/migrate.Dockerfile
    image: panasahrm/migrate:${HRM_IMAGE_TAG:-local}
    container_name: hrm-migrate
    restart: "no"
    command: ["node", "scripts/migrate.mjs", "up"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-hrm}
      # Migrations run as the OWNER. This is the one place that is correct: creating tables,
      # constraints and triggers requires it, and it is exactly why the application should not
      # use the same role.
      PGUSER: ${HRM_PG_OWNER_USER}
      PGPASSWORD: ${HRM_PG_OWNER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  # --------------------------------------------------------------------------------------
  # DEMO DATA. Behind a profile, so it CANNOT run on an ordinary deploy.
  #
  # `docker compose up -d` ignores a profiled service entirely. Loading demo data therefore takes
  # an explicit, differently-shaped command:
  #
  #   docker compose -f docker-compose.prod.yml --env-file prod.env --profile seed run --rm seed
  #
  # That asymmetry IS the safety property. This seed is DESTRUCTIVE - it wipes and recreates every
  # table it touches - so it must never be reachable by the command somebody types to restart the
  # stack at 2am. Two guards must be opened deliberately, and both are visible here rather than
  # buried in the script:
  #
  #   HRM_SEED_ALLOW_NONDEV  seed.mjs refuses any target that is not 127.0.0.1:55432. Inside
  #                          compose the host is `postgres`, so it refuses by default - correct,
  #                          and the override has to be stated.
  #   HRM_DEMO_PASSWORD      every demo account shares one password. Left unset it is the value
  #                          committed in the repository, which on a reachable host is a public
  #                          credential. Enforced by the container's own command, NOT by a `:?`
  #                          on the variable - see the note on `command:` below.
  #
  # It runs as the OWNER: clearing effective-dated and append-only tables means disabling their
  # triggers, which only the owner can do.
  seed:
    profiles: ["seed"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/migrate.Dockerfile
    image: panasahrm/migrate:${HRM_IMAGE_TAG:-local}
    container_name: hrm-seed
    restart: "no"
    # The demo-password guard lives HERE, in the container, and not in the interpolation above.
    #
    # It was `${HRM_DEMO_PASSWORD:?...}`, which broke every ordinary deploy: compose interpolates
    # the WHOLE file on every command - `build` and `up` included - and profiles do not exempt a
    # service from that. So a stack that will never run the seed still refused to build, with an
    # error naming a variable the operator was correctly told to leave blank. Found on the VM,
    # not here, because the verification env file always had the variable filled in.
    #
    # In the container the check fires only when the seed is actually invoked, which is what was
    # wanted in the first place. `$$` escapes the `$` so compose leaves it for the shell.
    command:
      - sh
      - -c
      - |
        if [ -z "$${HRM_DEMO_PASSWORD}" ]; then
          echo "REFUSED: HRM_DEMO_PASSWORD is not set." >&2
          echo "" >&2
          echo "Every demo account shares one password. Left unset, seed.mjs falls back to the" >&2
          echo "value committed in the repository - on a reachable host that is a public" >&2
          echo "credential, not a default." >&2
          echo "" >&2
          echo "  HRM_DEMO_PASSWORD='<choose one>' docker compose -f ... --profile seed run --rm seed" >&2
          exit 1
        fi
        exec node scripts/seed.mjs
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-hrm}
      PGUSER: ${HRM_PG_OWNER_USER}
      PGPASSWORD: ${HRM_PG_OWNER_PASSWORD}
      HRM_SEED_ALLOW_NONDEV: i-understand
      HRM_DEMO_PASSWORD: ${HRM_DEMO_PASSWORD:-}
      HRM_MINIO_HOST: minio
      HRM_MINIO_PORT: "9000"
      HRM_MINIO_ACCESS_KEY: ${HRM_MINIO_ACCESS_KEY}
      HRM_MINIO_SECRET_KEY: ${HRM_MINIO_SECRET_KEY}
      HRM_DOC_BUCKET: ${HRM_DOC_BUCKET:-hrm-documents}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # --------------------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    image: panasahrm/api:${HRM_IMAGE_TAG:-local}
    container_name: hrm-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      # THE COOKIE. This one switch drives BOTH the `Secure` flag and the `__Host-` name prefix
      # (apps/api/src/auth.ts). Without it the session cookie ships over TLS without Secure,
      # which is a downgrade nobody sees. True for any https deployment - which is every
      # deployment behind the host nginx.
      HRM_SECURE_COOKIES: ${HRM_SECURE_COOKIES:-true}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-hrm}
      # SHOULD NOT be the owner - the API holding a least-privilege role is the whole point of
      # migration 0008, and while it connects as the owner it bypasses every grant, including the
      # Tier-1 revokes protecting the payslip tables (OR-29).
      #
      # IT STILL HAS TO BE THE OWNER TODAY. Finding P3-7: the leave flow cannot run as `hrm_app`
      # at all, because the ledger trigger needs a grant the role lacks. So set these to the
      # owner credentials until P3-7 is fixed; the separate variables exist so that fix becomes a
      # configuration change rather than a compose rewrite.
      PGUSER: ${HRM_PG_APP_USER:?set HRM_PG_APP_USER in prod.env - see the P3-7 note}
      PGPASSWORD: ${HRM_PG_APP_PASSWORD:?set HRM_PG_APP_PASSWORD in prod.env}
      HRM_MINIO_HOST: minio
      HRM_MINIO_PORT: "9000"
      HRM_MINIO_SSL: "false"        # in-network hop on the compose bridge; TLS ends at the host
      HRM_MINIO_ACCESS_KEY: ${HRM_MINIO_ACCESS_KEY}
      HRM_MINIO_SECRET_KEY: ${HRM_MINIO_SECRET_KEY}
      HRM_DOC_BUCKET: ${HRM_DOC_BUCKET:-hrm-documents}
      # --- THE AI ASSISTANT (ADR-0020) ------------------------------------------------------
      #
      # OFF as shipped, and off even when switched on until a readable key file is mounted below.
      # ADR-0020 deferred *how* the key reaches a production container to the deployment; this is
      # that decision made (DEC-164), not a change of posture.
      #
      # HAVING SOMEWHERE TO PUT THE KEY IS NOT CLEARANCE TO SWITCH IT ON. ADR-0020's release gate
      # is a 100% `assistant:redteam` score with no waiver.
      #
      # A BLANK value is treated as ABSENT by the API (apps/api/src/assistant/llm.ts), which is
      # what makes the `:-` defaults here safe: an operator who sets none of the optional
      # variables gets the code's defaults, not a model named "" or a zero-millisecond timeout.
      HRM_ASSISTANT_ENABLED: ${HRM_ASSISTANT_ENABLED:-false}
      # FIXED, and deliberately not a prod.env variable: this is the container-side half of the
      # bind mount below, and a second knob could only ever disagree with the first. Another
      # secret mechanism - a swarm secret, a secrets agent - mounts its file at this same path.
      HRM_LLM_API_KEY_FILE: /run/secrets/hrm_llm_api_key
      # NOT DECLARED, on purpose: HRM_LLM_API_KEY. The plain variable holds the key in the
      # environment, where `docker inspect` and /proc/<pid>/environ can read it, and
      # security-guidelines.md ("Secrets") bars that for a deployment. It exists for local
      # development only (DEC-129). Undeclared here means it cannot be passed by accident.
      HRM_LLM_MODEL: ${HRM_LLM_MODEL:-}
      HRM_LLM_BASE_URL: ${HRM_LLM_BASE_URL:-}
      HRM_LLM_TIMEOUT_MS: ${HRM_LLM_TIMEOUT_MS:-}
      # THE ONE SWITCH THAT DECIDES WHETHER PERSONAL DATA CROSSES THE BORDER. Default (true) sends
      # the masked result rows the asker is already being shown, so the answer can state a figure
      # (DEC-140, amending ADR-0020 s3). `false` sends column names and a row count only.
      HRM_LLM_ANSWER_FROM_ROWS: ${HRM_LLM_ANSWER_FROM_ROWS:-}
      HRM_LLM_STREAM: ${HRM_LLM_STREAM:-}
    volumes:
      # THE PROVIDER KEY, file-backed. `HRM_LLM_KEY_HOST_PATH` is a path ON THE VM; it arrives
      # read-only at the fixed path the API is told to read. Never a build arg - build args
      # persist in image layers.
      #
      # IT DEFAULTS TO /dev/null, which reads as an EMPTY file: with the assistant off - the
      # shipped state - there is no key, `Llm.enabled` stays false, and the mount is inert. A bind
      # mount cannot be made conditional in compose and an empty source is a syntax error, so a
      # harmless always-present source is the way to keep this one variable rather than two.
      #
      # THE FILE MUST EXIST BEFORE THE FIRST `up`. Docker creates a DIRECTORY at a bind source
      # that is missing, and the API then reports the path unreadable and refuses every question -
      # a failure that reads like a code problem and is not. `deploy.sh` checks for it first.
      #
      # OWNERSHIP MATTERS: the API container runs as `node`, uid 1000 (api.Dockerfile), so a 0400
      # file owned by root on the host is unreadable inside it. Create it as:
      #     sudo install -o 1000 -g 1000 -m 0400 /dev/null /etc/panasa-hrm/llm-api-key
      #     sudo sh -c 'printf %s "sk-..." > /etc/panasa-hrm/llm-api-key'
      - ${HRM_LLM_KEY_HOST_PATH:-/dev/null}:/run/secrets/hrm_llm_api_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /api/auth/me answers 401 without a session. ANY HTTP response proves the process is
      # listening and routing, which is what a liveness probe is for. There is no unauthenticated
      # health route, and adding one would need an authz-matrix entry (Forbidden Actions).
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:4000,path:'/api/auth/me'},()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # Both baked in at BUILD time - Next resolves basePath during the build, and serialises
        # rewrites() into the routes manifest. Neither can be changed by restarting a container.
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        HRM_API_ORIGIN: http://api:4000
    image: panasahrm/web:${HRM_IMAGE_TAG:-local}
    container_name: hrm-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: "0.0.0.0"
      # Runtime copy of the build arg. Next does not need it (the value is already compiled in);
      # the healthcheck below builds its probe path from it.
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:3100,path:(process.env.NEXT_PUBLIC_BASE_PATH||'')+'/login'},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: hrm-nginx
    restart: unless-stopped
    environment:
      # The image's entrypoint runs envsubst over /etc/nginx/templates/*.template and writes the
      # result here, so nginx.conf.template becomes /etc/nginx/nginx.conf before nginx starts.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      # The ONLY value substituted. Must match the web image's NEXT_PUBLIC_BASE_PATH exactly, or
      # the API location silently stops matching and every API call detours through Next.
      HRM_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    volumes:
      - ../nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ../nginx/hrm_proxy_params:/etc/nginx/hrm_proxy_params:ro
    ports:
      # Loopback only. The host nginx terminates TLS on :7777 and reverse-proxies to this port.
      # 4765/4766/4767 belong to other apps on that host and 4787 was in use too, so 4788.
      - "127.0.0.1:${HRM_PUBLISH_PORT:-4788}:80"
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
  redisdata:

# WHAT IS DELIBERATELY NOT HERE
#
#   the BullMQ worker - ADR-0013 names it and no code publishes a job yet.
#   the observability stack - ADR-0013 names OpenTelemetry; nothing is instrumented.
#   backups - ADR-0013 amendment (b): no backup script, no restore runbook, no verified restore
#   drill, and Phase 9 gates go-live on one. See DEPLOY.md, "Before go-live".
