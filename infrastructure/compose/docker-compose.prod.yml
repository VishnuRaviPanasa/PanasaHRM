# PanasaHRM production stack - Docker Compose on a single VM (ADR-0013).
#
#   host nginx (TLS :7777) --/panasa-hrm/-->  127.0.0.1:4787
#                                                   |  nginx (edge, :80)
#                                                   |-- /api/ -->  api  :4000   (NestJS 11)
#                                                   `-- /     -->  web  :3100   (Next.js 16)
#                                                                    |
#                                          postgres :5432  <---------|
#                                          minio    :9000  <---------'
#
# ONLY the edge nginx publishes a host port, and it publishes to 127.0.0.1 only. PostgreSQL and
# MinIO are reachable on the compose network and nowhere else - never expose a database, or an
# object store holding employee documents, to the LAN.
#
# Run it from the REPOSITORY ROOT (the build contexts are the repo root):
#   ./deploy.sh
# or by hand:
#   docker compose -f infrastructure/compose/docker-compose.prod.yml \
#                  --env-file infrastructure/compose/prod.env up -d --build
#
# Every secret below is ${VAR:?...} with no default, on purpose: a missing secret must stop the
# deploy naming the variable, not start the stack on a development password.

name: panasahrm

services:
  # --------------------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: hrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:?set PGUSER in prod.env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in prod.env}
      POSTGRES_DB: ${PGDATABASE:?set PGDATABASE in prod.env}
      # Deterministic collation. A collation difference between environments silently reorders
      # indexes and can corrupt unique constraints on text columns.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=500
      - -c
      - max_connections=100
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      # DEC-010 / ADR-0013(c): PG18 mounts at /var/lib/postgresql, NOT .../data. The image then
      # places the cluster in a major-version subdirectory, which is what makes a later
      # `pg_upgrade --link` possible across the mount boundary. Mounting at .../data on 18+
      # makes the container refuse to start.
      #
      # THE LIVE DATA PATH IS /var/lib/postgresql/18/docker. Any backup or restore must target
      # it explicitly - this is the thing that is easy to get wrong at 3am.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # --------------------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: hrm-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${HRM_MINIO_ACCESS_KEY:?set HRM_MINIO_ACCESS_KEY in prod.env}
      MINIO_ROOT_PASSWORD: ${HRM_MINIO_SECRET_KEY:?set HRM_MINIO_SECRET_KEY in prod.env}
      MINIO_BROWSER: ${HRM_MINIO_BROWSER:-off}   # console off in production by default
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------------------------------------
  # ADR-0013: migrations run as a SEPARATE ONE-SHOT CONTAINER, never on app boot. `api` waits
  # for this to exit 0, so a failed migration means the API never starts against a half-applied
  # schema, instead of every replica racing to apply it.
  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/migrate.Dockerfile
    image: panasahrm/migrate:${HRM_IMAGE_TAG:-local}
    container_name: hrm-migrate
    restart: "no"
    command: ["up"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
    depends_on:
      postgres:
        condition: service_healthy

  # --------------------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    image: panasahrm/api:${HRM_IMAGE_TAG:-local}
    container_name: hrm-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      HRM_MINIO_HOST: minio
      HRM_MINIO_PORT: "9000"
      HRM_MINIO_SSL: "false"        # in-network hop on the compose bridge; TLS ends at the host
      HRM_MINIO_ACCESS_KEY: ${HRM_MINIO_ACCESS_KEY}
      HRM_MINIO_SECRET_KEY: ${HRM_MINIO_SECRET_KEY}
      HRM_DOC_BUCKET: ${HRM_DOC_BUCKET:-hrm-documents}
      # The session cookie IS served over TLS in this deployment (the host nginx terminates it),
      # so it must carry Secure. The default stays false in code so local HTTP still works.
      HRM_COOKIE_SECURE: ${HRM_COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /api/auth/me answers 401 without a session. ANY HTTP response proves the process is
      # listening and routing, which is what a liveness probe is for. There is no unauthenticated
      # health route, and adding one would need an authz-matrix entry (Forbidden Actions).
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:4000,path:'/api/auth/me'},()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # Baked in at BUILD time - Next resolves basePath/assetPrefix during the build and no
        # runtime variable can change it. Empty = served at the root of the published port.
        # Set to /panasa-hrm when the host nginx path-routes (see DEPLOY.md).
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        # Build-time for the same reason: `rewrites()` is evaluated by `next build`, not at boot.
        HRM_API_ORIGIN: http://api:4000
    image: panasahrm/web:${HRM_IMAGE_TAG:-local}
    container_name: hrm-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: "0.0.0.0"
      # Runtime copy of the build arg. Next itself does not need it (the value is already
      # compiled in); the healthcheck below builds its probe path from it.
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      # Kept for parity with the build arg above; the value that actually takes effect is the
      # one baked in at build time (see web.Dockerfile). Setting it here changes nothing on its
      # own - it is here so the two cannot drift out of sight of each other.
      HRM_API_ORIGIN: http://api:4000
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:3100,path:(process.env.NEXT_PUBLIC_BASE_PATH||'')+'/login'},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: hrm-nginx
    restart: unless-stopped
    environment:
      # The image's entrypoint runs envsubst over /etc/nginx/templates/*.template and writes the
      # result here, so nginx.conf.template becomes /etc/nginx/nginx.conf before nginx starts.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      # The ONLY value substituted. Must match the web image's NEXT_PUBLIC_BASE_PATH exactly, or
      # the API location silently stops matching and every API call takes a detour through Next.
      HRM_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    volumes:
      - ../nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ../nginx/hrm_proxy_params:/etc/nginx/hrm_proxy_params:ro
    ports:
      # Loopback only. The host nginx terminates TLS on :7777 and reverse-proxies to this port.
      # 4765/4766/4767 are already taken on this host, so PanasaHRM uses 4787.
      - "127.0.0.1:${HRM_PUBLISH_PORT:-4787}:80"
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:

# WHAT IS DELIBERATELY NOT HERE
#
#   redis + a BullMQ worker - ADR-0013 names both and no code connects to either yet. An unused
#   Redis is an unused password and an unused listener; it lands with the worker that needs it.
#   ADR-0010 also makes Redis authoritative for the session record, which the API does not do
#   yet (sessions live in PostgreSQL), so adding Redis now would imply a session migration too.
#
#   the observability stack - ADR-0013 names OpenTelemetry; nothing is instrumented yet.
#
#   backups - ADR-0013 amendment (b): there is no backup script, no restore runbook and no
#   verified restore drill, and Phase 9 gates go-live on one. See DEPLOY.md, "Before go-live".
